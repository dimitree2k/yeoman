[project]
name = "yeoman"
version = "0.6.0"
description = "Policy-first personal AI assistant runtime"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "yeoman contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "yeoman-shared",
    "yeoman-gateway",
    "yeoman-overseer",
]

[project.scripts]
yeoman = "yeoman_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
yeoman-shared = { workspace = true }
yeoman-gateway = { workspace = true }
yeoman-overseer = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["override", "union-attr", "no-any-return", "dict-item", "arg-type", "import-untyped"]

[[tool.mypy.overrides]]
module = ["yeoman_gateway.core.*", "yeoman_gateway.adapters.*", "yeoman_gateway.app.*"]
strict = true
ignore_missing_imports = false
disable_error_code = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.5",
    "mypy>=1.19.1",
]
