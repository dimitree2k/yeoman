[tool.uv.workspace]
members = ["packages/shared", "packages/gateway", "packages/overseer"]

[tool.uv.sources]
yeoman-shared = { workspace = true }
yeoman-gateway = { workspace = true }
yeoman-overseer = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["override", "union-attr", "no-any-return", "dict-item", "arg-type", "import-untyped"]

[[tool.mypy.overrides]]
module = ["yeoman_gateway.core.*", "yeoman_gateway.adapters.*", "yeoman_gateway.app.*"]
strict = true
ignore_missing_imports = false
disable_error_code = []

[dependency-groups]
dev = [
    "yeoman-gateway",
    "yeoman-shared",
    "yeoman-overseer",
    "pytest>=9.0.3",
    "pygments>=2.20.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.5",
    "mypy>=2.3.0",
]
