name: PR Lens

# On demand: runs only on PRs carrying the `pr-lens` label (when the label is
# added, and on each later push). Remove the label to stop it.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: write        # publish the rendered SVGs to the pr-lens branch
  pull-requests: write   # post the comment

concurrency:             # one run per pull request; a push supersedes the last
  group: pr-lens-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lens:
    # Fork PRs get no secrets, so the job cannot run for them.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'pr-lens') &&
      (github.event.action != 'labeled' || github.event.label.name == 'pr-lens')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff is between two commits
      - uses: coldteadotai/pr-lens/packages/action@v0
        with:
          api-key: ${{ secrets.DEEPSEEK_API_KEY_GH }}
          provider: openai-compatible
          base-url: https://api.deepseek.com
          model: deepseek-chat
