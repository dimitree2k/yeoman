name: A2A Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dimitree2k/hermes-yeoman-a2a-contracts
          ref: 1c658bfc4d5ae872f47d9abeef5aa365cf305af1
          path: .contracts
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run yeoman a2a conformance --contracts-checkout .contracts
