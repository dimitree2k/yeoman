name: Create GitHub Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract section between this version header and the next
          awk "/^## ${TAG//./\\.}/"'{found=1; next} /^## v/{if(found) exit} found' CHANGELOG.md > /tmp/notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.changelog.outputs.tag }}" \
            --title "${{ steps.changelog.outputs.tag }}" \
            --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
