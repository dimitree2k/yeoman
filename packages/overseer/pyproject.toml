[project]
name = "yeoman-overseer"
version = "1.0.0"
description = "Yeoman overseer — autonomous orchestration layer"
requires-python = ">=3.14"
dependencies = [
    "yeoman-shared",
    "pyyaml>=6.0.2",
    "croniter>=6.0.0",
    "httpx>=0.28.1",
    "openai>=1.60.0",
    "sdnotify>=0.3.2",
]

[tool.uv.sources]
yeoman-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
