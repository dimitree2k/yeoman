[project]
name = "yeoman-shared"
version = "0.7.1"
description = "Shared configuration, telemetry, and utilities for yeoman"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "loguru>=0.7.3",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
